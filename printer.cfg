# This file contains common pin mappings for the BigTreeTech OctoPus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths							[mcu] section
## Thermistor types						[extruder] and [heater_bed] sections - See 'sensor types' list at end of file
## Z Endstop Switch location			[safe_z_home] section
## Z Endstop Switch  offset for Z0		[stepper_z] section
## Probe points							[quad_gantry_level] section
## Min & Max gantry corner postions		[quad_gantry_level] section
## PID tune								[extruder] and [heater_bed] sections
## Fine tune E steps					[extruder] section

[exclude_object]

[respond]
default_type: echo
# Valores posibles para default_type: echo, echo_prefix, command, error

[mcu]
##	[X in MOTOR0] - B Motor
##	[Y in MOTOR1] - A Motor
##	[E in MOTOR6] - Extruder
##	Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_0B003400165053424E363620-if00
#restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 350  
max_accel: 3000    			#Max 4000
max_z_velocity: 50 			#Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 10.0

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on MOTOR0(B Motor)
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG6
position_min: 0
##--------------------------------------------------------------------


position_endstop: 350 #eje X
position_max: 350 #eje X

##--------------------------------------------------------------------
homing_speed: 25   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_x]
uart_pin: PC4
interpolate: True
run_current: 0.8
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

## Y Stepper on MOTOR1 (A Motor)
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin: PG9
position_min: 0
##--------------------------------------------------------------------


position_endstop: 358 #eje Y
position_max: 358 #eje Y

##--------------------------------------------------------------------
homing_speed: 25  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_y]
uart_pin: PD11
interpolate: True
run_current: 0.8
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left on MOTOR2_1
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: PG10
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
##--------------------------------------------------------------------


position_max: 325

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PC6
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z1 Stepper - Rear Left on MOTOR3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z2 Stepper - Rear Right on MOTOR4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z3 Stepper - Front Right on MOTOR5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: true
run_current: 0.8
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Extruder
#####################################################################

#	E0 on MOTOR6
[extruder]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
##	Update value below when you perform extruder calibration
##	If you ask for 100mm of filament, but in reality it is 98mm:
##	rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
# rotation_distance: 22.6789511	#Bondtech 5mm Drive Gears

rotation_distance: 46.8855
gear_ratio: 9:1
microsteps: 16


##	Update Gear Ratio depending on your Extruder Type
##	Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##	Use 80:20 for M4, M3.1
# gear_ratio: 50:17				#BMG Gear Ratio
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PA2
##	Validate the following thermistor type to make sure it is correct
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF4
min_temp: -70 #10
max_temp: 270
max_power: 1.0
min_extrude_temp: 170
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##	Try to keep pressure_advance below 1.0
pressure_advance: 0.05
##	Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040

##	E0 on MOTOR6
##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 extruder]
uart_pin: PE1
interpolate: false
# run_current: 0.5
run_current: 0.6
hold_current: 0.4
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
##	SSR Pin - BED_OUT
heater_pin: PA1
sensor_type: Generic 3950 # NTC 100K beta 3950
sensor_pin: PF3
##	Adjust Max Power so your heater doesn't warp your bed
max_power: 0.6
min_temp: -70 #0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
# 	Probe
#####################################################################

[probe]
##	Inductive Probe
##	This probe is not used for Z height, only Quad Gantry Leveling
pin: ~PB7
# pin: ^PB7
# pin: !PB7
x_offset: 0
y_offset: 25.0
z_offset: 0
speed: 20#10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3

#####################################################################
# 	Fan Control
#####################################################################

[fan]
##	Print Cooling Fan - CNC_FAN0
pin: PA8
kick_start_time: 0.5
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan hotend_fan]
##	Hotend Fan - CNC_FAN1
pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##	If you are experiencing back flow, you can reduce fan_speed
fan_speed: 1.0

[heater_fan electronica_ventilador1]
pin: PD12
kick_start_time: 0.5
heater: heater_bed
max_power: 1.0
shutdown_speed: 0.0
heater_temp: 60
fan_speed: 0.6 #1.0

[heater_fan electronica_ventilador2]
pin: PD14
kick_start_time: 0.5
heater: heater_bed
max_power: 1.0
shutdown_speed: 0.0
heater_temp: 60
fan_speed: 0.6 #1.0

#[heater_fan exhaust_fan]
##	Exhaust fan - CNC_FAN3
#pin: PD13
#max_power: 1.0
#shutdown_speed: 0.0
#kick_start_time: 5.0
#heater: heater_bed
#heater_temp: 60
#fan_speed: 0.5 #1.0

#####################################################################
[temperature_fan chamber]
pin: PD13
max_power: 0.8
shutdown_speed: 0.0
kick_start_time: 5.0
cycle_time:0.01
off_below:0.1
sensor_type: Generic 3950 # NTC 100K beta 3950
sensor_pin: PF5
min_temp: 0
max_temp: 70
target_temp: 50.0
control: watermark
gcode_id: C

#####################################################################
[gcode_macro M141]
gcode:
    {% set S = params.S|default(0)|float %}
    {% set P = params.P|default(0)|float %}
    SET_TEMPERATURE_FAN_TARGET temperature_fan="chamber" target={S}
####################################################################

####################################################################
# APAGAR
####################################################################
[gcode_macro APAGAR]
gcode:
    TURN_OFF_HEATERS                      ; Apaga los calentadores
    M107                                  ; Apaga los ventiladores de capa
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=70  ; Espera a que el extrusor baje de 70°C
    SET_PIN PIN=apagado VALUE=0           ; Corta la energía general



######################################################################
# Beeper
######################################################################

# M300 : Play tone. Beeper support, as commonly found on usual LCD
# displays (i.e. RepRapDiscount 2004 Smart Controller, RepRapDiscount
# 12864 Full Graphic). This defines a custom I/O pin and a custom
# GCODE macro.  Usage:
#   M300 [P<ms>] [S<Hz>]
#   P is the tone duration, S the tone frequency.
# The frequency won't be pitch perfect.

[output_pin BEEPER_pin]
pin: PE8
#   Beeper pin. This parameter must be provided.
pwm: True
#   A piezo beeper needs a PWM signal, a DC buzzer doesn't.
value: 0
#   Silent at power on, set to 1 if active low.
shutdown_value: 0
#   Disable at emergency shutdown (no PWM would be available anyway).
cycle_time: 0.001
#   Default PWM frequency : 0.001 = 1ms will give a tone of 1kHz
#   Although not pitch perfect.

[gcode_macro M300]
gcode:
    # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(4300)|int %}
    # Use a 1000ms duration is P is omitted.
    {% set P = params.P|default(1000)|int %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0



#####################################################################
# 	luces_camara
#####################################################################

[output_pin luces_camara]
pin: PA3                    # Pin correspondiente al puerto HE1 en la Octopus v1
pwm: true                   # Permite regular el brillo de los LEDs
value: 1                    # Arranca al 100% de brillo al encender la impresora
shutdown_value: 0.0         # Se apaga por completo ante cualquier error/emergencia
cycle_time: 0.010           # Frecuencia para regular el paso de energía sin parpadeos
scale: 1                    # Define el rango del slider entre 0.0 y 1.0


#####################################################################
#   APAGADO
#####################################################################

[output_pin apagado]
pin: PE11
#   The pin to configure as an output. This parameter must be
#   provided.
pwm: False
#   Set if the output pin should be capable of pulse-width-modulation.
#   If this is true, the value fields should be between 0 and 1; if it
#   is false the value fields should be either 0 or 1. The default is
#   False.
#static_value:
#   If this is set, then the pin is assigned to this value at startup
#   and the pin can not be changed during runtime. A static pin uses
#   slightly less ram in the micro-controller. The default is to use
#   runtime configuration of pins.
value: 1
#   The value to initially set the pin to during MCU configuration.
#   The default is 0 (for low voltage).
shutdown_value: 1
#   The value to set the pin to on an MCU shutdown event. The default
#   is 0 (for low voltage).
#maximum_mcu_duration:
#   The maximum duration a non-shutdown value may be driven by the MCU
#   without an acknowledge from the host.
#   If host can not keep up with an update, the MCU will shutdown
#   and set all pins to their respective shutdown values.
#   Default: 0 (disabled)
#   Usual values are around 5 seconds.
#cycle_time: 0.100
#   The amount of time (in seconds) per PWM cycle. It is recommended
#   this be 10 milliseconds or greater when using software based PWM.
#   The default is 0.100 seconds for pwm pins.
#hardware_pwm: False
#   Enable this to use hardware PWM instead of software PWM. When
#   using hardware PWM the actual cycle time is constrained by the
#   implementation and may be significantly different than the
#   requested cycle_time. The default is False.
#scale:
#   This parameter can be used to alter how the 'value' and
#   'shutdown_value' parameters are interpreted for pwm pins. If
#   provided, then the 'value' parameter should be between 0.0 and
#   'scale'. This may be useful when configuring a PWM pin that
#   controls a stepper voltage reference. The 'scale' can be set to
#   the equivalent stepper amperage if the PWM were fully enabled, and
#   then the 'value' parameter can be specified using the desired
#   amperage for the stepper. The default is to not scale the 'value'
#   parameter.

#####################################################################
# 	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -10,-10 to the XY coordinates of your endstop pin 
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
home_xy_position:233,358
speed:300#100
z_hop:10

[quad_gantry_level]
##	Use QUAD_GANTRY_LEVEL to level a gantry.
##	Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##	MAX (250, 250), (300,300), or (350,350) depending on your printer size
##	to respective belt positions

#--------------------------------------------------------------------

gantry_corners:
	-60,-10
	410,420
##	Probe points
points:
	50,25
	50,275
	300,275
	300,25

#--------------------------------------------------------------------
speed: 400#100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10


########################################################################
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

#####################################################################
#   Mesh Bed Leveling
#####################################################################

[bed_mesh]
speed: 300
horizontal_move_z: 10
##--------------------------------------------------------------------

mesh_min: 40, 40
mesh_max: 310,310
##--------------------------------------------------------------------
fade_start: 0.6
fade_end: 10.0
probe_count: 4,4
algorithm: bicubic

# ELIMINADO (OBSOLETO):
# relative_reference_index: 24

# AGREGADO (Coordenada central calculada):
zero_reference_position: 175, 175


#####################################################################
# 	Macros
#####################################################################
   
[gcode_macro PRINT_START]
gcode:
    # 1. Obtener parámetros de temperatura desde el laminador
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}

    # 2. Tono inicial
    M300 P250 S4300
    G4 P250
    M300 P250 S4300

    # 3. Limpiar malla previa y precalentar
    status_heating					; leds del cabezal en modo heating
	RESPOND MSG="Calentando la cama y el extrusor"
    BED_MESH_CLEAR
    M140 S{BED_TEMP}                ; Iniciar calentamiento de cama
    M104 S{EXTRUDER_TEMP}                        ; Precalentar boquilla a 150°C (evita goteo)
    M190 S{BED_TEMP}                ; Esperar a que la cama alcance temperatura objetivo
	M109 S{EXTRUDER_TEMP} 					; Espera a que la boquilla alcance 150°
	

    # 4. Homing y nivelado de gantry
	status_homing					; leds cabezal
	RESPOND MSG="Posición de origen"
    G28                             ; Home inicial

	status_leveling					;leds cabezal
	RESPOND MSG="Nivelación cuádruple"
    QUAD_GANTRY_LEVEL               ; Nivelar gantry (QGL)
    
    # 5. Limpieza de boquilla y re-homing de Z
	status_cleaning					; leds cabezal
	RESPOND MSG="Cepillando"
    CEPILLAR                        ; Limpiar boquilla a 150°C

	RESPOND MSG="Posición de origen"
	status_homing					; leds cabezal
    G28                          	; Re-homing solo en Z tras QGL

    # 6. Malla de la cama (Bed Mesh)
	status_meshing					; leds cabezal
	RESPOND MSG="Generando mapa de la cama"
    BED_MESH_CALIBRATE              ; Calibrar malla (o usar: BED_MESH_PROFILE LOAD=default)

    # 7. Posicionar al centro y calentar a temperatura final de impresión
	status_heating					; leds cabezal
	RESPOND MSG="Posicionado al centro y comprobando temperaturas"
    G0 X175 Y175 Z30 F3600
    M109 S{EXTRUDER_TEMP}           ; Esperar a temperatura final del fusor

    # 8. Avisos y preparación final
    M300 P500 S4300
    # CEPILLAR                      ; Segunda limpieza ligera
    G1 Z20 F3000                    ; Levantar boquilla
	status_printing					; leds cabezal
	RESPOND MSG="Imprimiendo"
   

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; pone a cero la coordenada del extrusor
    #G1 E-10.0 F3600                ; retrae 10 mm de filamento a una velocidad de 3600 mm/minuto
    G91                            ; hace que el posicionamiento sea relativo a esta posicion
    G0 Z1.00 X20.0 Y20.0 F20000    ; levanta el cabezal 1 mm lo mueve 20 mm hacia la derecha y 20mm hacia atras a una velocidad de 20000 mm/minuto (333 mm/seg)
    TURN_OFF_HEATERS               ; apaga todos los calentadores
    M107                           ; apaga el ventilador de capa
    G1 Z2 F3000                    ; levanta el cabezal 2 mm a una velocidad de 3600 mm/min. (60 mm/seg)
    G90                            ; define el posicionamiento como absoluto
    G0  X325 Y325 F3600            ; estaciona el cabezal atras a la derecha a una velocidad de 60 mm/seg
    BED_MESH_CLEAR                 ; clear de internal mesh state
    M300 P1000 S4300               ; GENERA TONO 4300HZ DURANTE 1S
    G4 P500                        ; espera 500mS
    M300 P1000 S4300               ; GENERA TONO 4300HZ DURANTE 1S
    G4 P500                        ; espera 500mS
    M300 P2000 S4300               ; GENERA TONO 4300HZ DURANTE 2S
    G4 P500                        ; espera 500mS
	SET_NOZZLE_LEDS_OFF				; apaga los led de abajo del cabezal
	SET_PIN PIN=luces_camara VALUE=0.0	; apaga las luces del gabinete
	RESPOND MSG="Impresión terminada"

    APAGAR                         ; inicia ciclo de apagado

[gcode_macro test_speed_fast]
gcode:
        G28 X0 Y0
        GET_POSITION
        G1 X0 Y0     F27000
        G1 X350 Y350 F27000
        G1 X0 Y0     F27000
        G1 X350 Y350 F27000

        G1 X0 Y350 F36000

        G1 X350 Y0 F27000
        G1 X0 Y350 F27000
        G1 X350 Y0 F27000
        G1 X0 Y350 F27000

        G1 X0 Y0 F36000
        G1 X350 Y0 F36000
        G1 X350 Y350 F36000
        G1 X0 Y350 F36000
        G1 X0 Y0 F36000
        G28 X0 Y0
        GET_POSITION

######################################################################
# Filament Change
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

[pause_resume]

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state
########################################################################

[gcode_macro CEPILLAR]
gcode:
    SAVE_GCODE_STATE NAME=PURGE  ;guarda la posicion antes del cepillado
    G90                    ; absolute
    G0 X127 Y358 Z1.39 F10000     ; inicio del cepillo
    G0 X77 Y358 Z1.39 F10000
    G0 X127 Y357 Z1.39 F10000
    G0 X77 Y356 Z1.39 F10000
    G0 X127 Y355 Z1.39 F10000
    G0 X77 Y354 Z1.39 F10000
    G0 X127 Y353 Z1.39 F10000
	G0 X127 Y353 Z50 F10000
    #G1 E-2 F500                   ; retrae filamento 2mm
    #G1 X25 E10 F500        ; purge some filament into bucket
    #G1 X75 E3 F500         ; purge some filament into bucket
    #G0 X73 Y358 F750      ; move across purge brush
    #G1 E-2 F500            ; Retract a little
    #G1 Z3                  ; Raise and return
    RESTORE_GCODE_STATE NAME=PURGE MOVE=1  ;Vuelve a la posicion antes del cepillado

[filament_motion_sensor Sensor_filamento]
detection_length: 12.0
#   The minimum length of filament pulled through the sensor to trigger
#   a state change on the switch_pin
#   Default is 7 mm.
extruder: extruder
#   The name of the extruder section this sensor is associated with.
#   This parameter must be provided.
pause_on_runout: True
#   When set to True, a PAUSE will execute immediately after a runout
#   is detected. Note that if pause_on_runout is False and the
#   runout_gcode is omitted then runout detection is disabled. Default
#   is True.
runout_gcode: 
    M118 FALTA FILAMENTO
    M300 P100 S4300               ; GENERA TONO 4300HZ DURANTE 100mS
    G4 P100                        ; espera 100mS
    M300 P100 S4300               ; GENERA TONO 4300HZ DURANTE 100mS
    G4 P100                        ; espera 100mS
    M300 P100 S4300               ; GENERA TONO 4300HZ DURANTE 100mS
    G4 P100                        ; espera 100mS
    M300 P100 S4300               ; GENERA TONO 4300HZ DURANTE 100mS
    G4 P100                        ; espera 100mS
    M300 P100 S4300               ; GENERA TONO 4300HZ DURANTE 100mS
    G4 P100                        ; espera 100mS
    M300 P100 S4300               ; GENERA TONO 4300HZ DURANTE 100mS
    G4 P100                        ; espera 100mS
    M300 P100 S4300               ; GENERA TONO 4300HZ DURANTE 100mS
    G4 P100                        ; espera 100mS
    M300 P100 S4300               ; GENERA TONO 4300HZ DURANTE 100mS
